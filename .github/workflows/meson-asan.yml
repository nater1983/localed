name: Meson tests and memory checks

on:
  push:
    branches:
      - "0.3.0"
      - "0.4.0"
      - "phase-7-final-stability-cleanup"
  pull_request:
    branches: [ "0.3.0", "0.4.0" ]

jobs:
  meson-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gettext \
            libglib2.0-dev \
            libpolkit-gobject-1-dev \
            meson \
            ninja-build \
            pkg-config \
            dbus-daemon \
            locales

      - name: Generate private test locale for language fallback coverage
        run: |
          mkdir -p "$RUNNER_TEMP/localed-test-locales"
          localedef --no-archive -i en_AU -f ISO-8859-1 "$RUNNER_TEMP/localed-test-locales/en_AU"

      - name: Configure isolated test paths
        run: |
          mkdir -p "$RUNNER_TEMP/localed-test-config"

      - name: Configure AddressSanitizer build
        run: |
          meson setup build-asan \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Dtests=true

      - name: Validate SlackBuild shell syntax
        run: bash -n localed.SlackBuild

      - name: Compile
        run: meson compile -C build-asan

      # The external harness starts a real daemon; keep that daemon's
      # configuration isolated separately from the normal test build.
      - name: Build isolated daemon for private-bus reconnect test
        run: |
          meson setup build-reconnect \
            --buildtype=debug \
            -Db_sanitize=address,undefined \
            -Dtests=false \
            -Dlang_sh="$RUNNER_TEMP/localed-test-config/lang.sh" \
            -Drc_keymap="$RUNNER_TEMP/localed-test-config/rc.keymap" \
            -Dx11_keyboard_conf="$RUNNER_TEMP/localed-test-config/00-keyboard.conf"
          meson compile -C build-reconnect

      - name: Exercise D-Bus reconnect and --replace on a private bus
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          G_SLICE: always-malloc
        run: sh tests/test-slackware-dbus-restart.sh "$PWD/build-reconnect/src/localed"

      - name: Run tests with leak detection
        env:
          LOCPATH: ${{ runner.temp }}/localed-test-locales
          RCL_TEST_REQUIRE_FALLBACK_LOCALE: "1"
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          G_SLICE: always-malloc
        run: meson test -C build-asan --print-errorlogs
