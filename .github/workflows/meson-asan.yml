name: Desktop integration tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [none, gnome, plasma6]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build pkg-config libglib2.0-dev dbus-daemon
      - run: meson setup build -Ddesktop-backend=${{ matrix.backend }} -Dtests=true -Db_sanitize=address,undefined --buildtype=debug
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
